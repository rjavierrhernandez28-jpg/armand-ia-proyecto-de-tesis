<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bienvenido</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(160deg, #0a0a2e, #0d1f4a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      overflow: hidden;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      color: #7eb8f7;
    }

    .mascota-container {
      position: relative;
      width: 280px;
      height: 320px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 20px rgba(46, 107, 228, 0.5));
      transition: filter 0.3s;
    }

    .mascota-container.hablando {
      filter: drop-shadow(0 0 40px rgba(126, 184, 247, 0.9));
      animation: flotar 0.4s infinite alternate;
    }

    @keyframes flotar {
      from { transform: translateY(0px); }
      to   { transform: translateY(-10px); }
    }

    @keyframes entrada {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0px);  opacity: 1; }
    }

    .mascota-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: entrada 0.8s ease-out;
    }

    .onda {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 12px;
      background: radial-gradient(ellipse, rgba(46,107,228,0.6), transparent);
      border-radius: 50%;
    }

    #respuesta {
      max-width: 580px;
      text-align: center;
      font-size: 1.1rem;
      min-height: 60px;
      color: #d0e8ff;
      margin-bottom: 25px;
      line-height: 1.6;
      padding: 0 20px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      padding: 12px 20px;
      width: 380px;
      border-radius: 30px;
      border: none;
      background: #1a2a4a;
      color: white;
      font-size: 1rem;
      outline: none;
      border: 1px solid #2d6be4;
    }

    input::placeholder { color: #556; }

    button {
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      background: #2d6be4;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover    { background: #1a50c0; }
    button:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Bienvenido a la Escuela</h1>

  <div class="mascota-container" id="mascota-container">
    <img src="mascota.png" alt="Mascota" id="mascota" />
    <div class="onda"></div>
  </div>

  <p id="respuesta">¡Hola! ¿En qué puedo ayudarte hoy?</p>

  <div class="input-area">
    <button id="btn-mic" onclick="iniciarMic()">🎤 Activar micrófono</button>
    <input type="text" id="entrada" placeholder="O escribe tu pregunta..." />
    <button id="btn" onclick="preguntar()">Preguntar</button>
  </div>

  <script>
    async function preguntar() {
      const entrada = document.getElementById("entrada");
      const respuestaEl = document.getElementById("respuesta");
      const btn = document.getElementById("btn");
      const contenedor = document.getElementById("mascota-container");

      const pregunta = entrada.value.trim();
      if (!pregunta) return;

      btn.disabled = true;
      respuestaEl.textContent = "Pensando...";
      entrada.value = "";

      try {
        const res = await fetch("http://127.0.0.1:5000/preguntar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pregunta })
        });

        const data = await res.json();
        const texto = data.respuesta;
        respuestaEl.textContent = texto;

        // Animar mascota mientras habla
        const palabras = texto.split(" ").length;
        const duracion = palabras * 400;

        contenedor.classList.add("hablando");

        setTimeout(() => {
          contenedor.classList.remove("hablando");
        }, duracion);

      } catch (e) {
        respuestaEl.textContent = "Error al conectar con el servidor.";
      }

      btn.disabled = false;
    }

    document.getElementById("entrada").addEventListener("keypress", function(e) {
      if (e.key === "Enter") preguntar();
    });

    async function iniciarMic() {
       const btn = document.getElementById("btn-mic");
       btn.disabled = true;
       btn.textContent = "🎤 Escuchando...";

       await fetch("http://127.0.0.1:5000/iniciar", { method: "POST" });

       document.getElementById("respuesta").textContent = "Te escucho, habla con claridad...";
    }
  </script>

</body>
</html>
